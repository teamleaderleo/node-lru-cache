name: Fieldwork TAP clock repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-repaired-ubuntu:
    if: >-
      github.repository == 'teamleaderleo/node-lru-cache' &&
      github.head_ref == 'ci/tap-clock-dev-dependency'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact repaired graph
        uses: actions/checkout@v6
        with:
          ref: 18430cc21147d1122d4b7a5ba94d96488d736326
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify exact two-file repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "18430cc21147d1122d4b7a5ba94d96488d736326"
          test "$(git diff --name-only 16b3a916662ab449d496b7b4b4f04132565d1d28...HEAD | sort)" = $'package-lock.json\npackage.json'
          node - <<'NODE'
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          if (pkg.devDependencies['@tapjs/clock'] !== '3.3.10') throw new Error('wrong package declaration')
          if (lock.packages['node_modules/@tapjs/clock']?.version !== '3.3.10') throw new Error('wrong lock resolution')
          NODE
          test -z "$(git status --porcelain)"

      - name: Install and run complete repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node -e "console.log(require.resolve('@tapjs/clock'))"
          npm test -- -c -t0
          git diff --check 16b3a916662ab449d496b7b4b4f04132565d1d28...HEAD
          git diff --exit-code HEAD -- package.json package-lock.json

  classify-windows-exit:
    if: >-
      github.repository == 'teamleaderleo/node-lru-cache' &&
      github.head_ref == 'ci/tap-clock-dev-dependency'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      TAP_COLOR: '0'
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          ref: 16b3a916662ab449d496b7b4b4f04132565d1d28
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Run unchanged base with configured plugin injected
        id: base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "16b3a916662ab449d496b7b4b4f04132565d1d28"
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts @tapjs/clock@3.3.10
          node -e "console.log(require.resolve('@tapjs/clock'))"
          git status --short
          git diff --exit-code HEAD -- package.json package-lock.json

          set +e
          npm test -- -c -t0 > base-coverage.log 2>&1
          coverage_status=$?
          npm test -- -t0 > base-no-coverage.log 2>&1
          no_coverage_status=$?
          set -e

          cat base-coverage.log
          cat base-no-coverage.log
          printf 'base_coverage_status=%s\n' "$coverage_status" >> "$GITHUB_OUTPUT"
          printf 'base_no_coverage_status=%s\n' "$no_coverage_status" >> "$GITHUB_OUTPUT"

      - name: Run repaired graph under identical commands
        id: repaired
        shell: bash
        run: |
          set -euo pipefail
          git clean -ffdx
          git checkout --force 18430cc21147d1122d4b7a5ba94d96488d736326
          test "$(git rev-parse HEAD)" = "18430cc21147d1122d4b7a5ba94d96488d736326"
          test "$(git diff --name-only 16b3a916662ab449d496b7b4b4f04132565d1d28...HEAD | sort)" = $'package-lock.json\npackage.json'
          npm ci
          node -e "console.log(require.resolve('@tapjs/clock'))"
          git status --short
          git diff --exit-code HEAD -- package.json package-lock.json

          set +e
          npm test -- -c -t0 > repaired-coverage.log 2>&1
          coverage_status=$?
          npm test -- -t0 > repaired-no-coverage.log 2>&1
          no_coverage_status=$?
          set -e

          cat repaired-coverage.log
          cat repaired-no-coverage.log
          printf 'repaired_coverage_status=%s\n' "$coverage_status" >> "$GITHUB_OUTPUT"
          printf 'repaired_no_coverage_status=%s\n' "$no_coverage_status" >> "$GITHUB_OUTPUT"
          git diff --exit-code HEAD -- package.json package-lock.json

      - name: Classify dependency repair separately from Windows exit
        shell: bash
        env:
          BASE_COVERAGE: ${{ steps.base.outputs.base_coverage_status }}
          BASE_NO_COVERAGE: ${{ steps.base.outputs.base_no_coverage_status }}
          REPAIRED_COVERAGE: ${{ steps.repaired.outputs.repaired_coverage_status }}
          REPAIRED_NO_COVERAGE: ${{ steps.repaired.outputs.repaired_no_coverage_status }}
        run: |
          set -euo pipefail
          printf 'base coverage=%s no-coverage=%s\n' "$BASE_COVERAGE" "$BASE_NO_COVERAGE"
          printf 'repaired coverage=%s no-coverage=%s\n' "$REPAIRED_COVERAGE" "$REPAIRED_NO_COVERAGE"
          test "$BASE_COVERAGE" = "$REPAIRED_COVERAGE"
          test "$BASE_NO_COVERAGE" = "$REPAIRED_NO_COVERAGE"
          test "$BASE_NO_COVERAGE" -eq 0
          printf 'FIELDWORK_TAP_CLOCK=dependency-repair-independent-of-windows-exit\n'
