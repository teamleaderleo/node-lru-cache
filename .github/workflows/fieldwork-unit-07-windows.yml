name: Fieldwork unit 07 Windows gate

on:
  pull_request:
    branches:
      - repair/background-fetch-size-source

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25]
        shell: [bash, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - name: Install baseline-declared Tap plugin without source changes
        run: npm install --no-save --package-lock=false @tapjs/clock@3.3.10
      - name: Run complete repository suite
        run: npm test -- -c -t0
      - name: Verify canonical files remain formatted
        run: npx prettier --check src/index.ts test/background-fetch-size.ts
      - name: Verify carrier did not alter tracked source
        run: git diff --check && git diff --exit-code
