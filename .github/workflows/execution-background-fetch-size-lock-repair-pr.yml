name: Background fetch size exact-head execution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    if: github.head_ref == 'execution/background-fetch-size-lock-repair'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.x
            shell: bash
          - os: macos-latest
            node: 24.x
            shell: bash
          - os: windows-latest
            node: 24.x
            shell: bash
          - os: windows-latest
            node: 24.x
            shell: powershell
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out exact canonical candidate
        uses: actions/checkout@v6
        with:
          ref: fef8328c9431b656c0ee48547250e37d6caeabef
          persist-credentials: false

      - name: Verify exact source fence
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "fef8328c9431b656c0ee48547250e37d6caeabef"
          grep -F "  __size?: number" src/index.ts
          grep -F '"@tapjs/clock": "3.3.10"' package.json
          test -z "$(git status --porcelain)"

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci

      - name: Build declarations and distributions
        run: npm run prepare

      - name: Run focused background-fetch-size controls
        run: npm exec -- tap -t0 test/background-fetch-size.ts

      - name: Run complete repository tests
        run: npm test -- -c -t0

      - name: Confirm clean source tree
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
