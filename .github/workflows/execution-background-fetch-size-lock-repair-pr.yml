name: Background fetch lock metadata repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'execution/background-fetch-size-lock-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact canonical candidate
        uses: actions/checkout@v6
        with:
          ref: repair/background-fetch-size-source
          fetch-depth: 0

      - name: Verify exact source fence
        run: |
          test "$(git rev-parse HEAD)" = "fef8328c9431b656c0ee48547250e37d6caeabef"
          test -z "$(git status --porcelain)"

      - name: Restore unrelated platform selectors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('package-lock.json')
          text = path.read_text()
          selectors = {
              'node_modules/@oxlint/binding-linux-arm64-gnu': 'glibc',
              'node_modules/@oxlint/binding-linux-arm64-musl': 'musl',
              'node_modules/@oxlint/binding-linux-ppc64-gnu': 'glibc',
              'node_modules/@oxlint/binding-linux-riscv64-gnu': 'glibc',
              'node_modules/@oxlint/binding-linux-riscv64-musl': 'musl',
              'node_modules/@oxlint/binding-linux-s390x-gnu': 'glibc',
              'node_modules/@oxlint/binding-linux-x64-gnu': 'glibc',
              'node_modules/@oxlint/binding-linux-x64-musl': 'musl',
          }

          for package, libc in selectors.items():
              marker = f'    "{package}": {{'
              start = text.index(marker)
              end = text.find('\n    "node_modules/', start + len(marker))
              if end < 0:
                  end = len(text)
              section = text[start:end]
              if '      "libc": [' in section:
                  raise SystemExit(f'{package}: libc selector already present')
              needle = '      "dev": true,\n      "license": "MIT",'
              if section.count(needle) != 1:
                  raise SystemExit(f'{package}: unexpected lock entry shape')
              replacement = (
                  '      "dev": true,\n'
                  '      "libc": [\n'
                  f'        "{libc}"\n'
                  '      ],\n'
                  '      "license": "MIT",'
              )
              section = section.replace(needle, replacement, 1)
              text = text[:start] + section + text[end:]

          path.write_text(text)
          PY

          git diff --check
          test "$(git diff --name-only)" = package-lock.json
          test "$(git diff --numstat package-lock.json | awk '{print $1 ":" $2}')" = 24:0

      - name: Validate the repaired lock and focused candidate
        run: |
          npm ci
          npm run prepare
          npm exec -- tap -t0 test/background-fetch-size.ts
          test "$(git diff --name-only)" = package-lock.json

      - name: Commit lock-only cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          test "$(git diff --cached --name-only)" = package-lock.json
          git commit -m "Restore OXLint lock platform selectors"
          git push origin HEAD:repair/background-fetch-size-source
