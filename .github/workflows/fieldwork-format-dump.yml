name: Fieldwork format dump

on:
  pull_request:
    branches:
      - repair/background-fetch-size-source

permissions:
  contents: read

jobs:
  format-dump:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx prettier --write test/background-fetch-size.ts
      - name: Emit exact formatted file
        shell: bash
        run: |
          echo 'FIELDWORK_FORMATTED_FILE_BEGIN'
          base64 -w0 test/background-fetch-size.ts
          echo
          echo 'FIELDWORK_FORMATTED_FILE_END'
